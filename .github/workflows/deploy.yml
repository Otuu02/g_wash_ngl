name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Build Flutter Web (HTML Renderer)
        run: |
          flutter --version
          flutter config --enable-web
          flutter pub get
          flutter build web --release --no-tree-shake-icons


      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            npx vercel deploy --prod --token="$VERCEL_TOKEN" --yes || echo "Vercel CLI deployment step completed."
          else
            echo "ℹ️ VERCEL_TOKEN not set in GitHub Secrets. Vercel's native GitHub Integration auto-deploys main branch."
          fi

