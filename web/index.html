  <script>
    function requestPushPermission() {
      if ('Notification' in window && Notification.permission !== 'granted') {
        Notification.requestPermission().catch(function(){});
      }
    }

    function triggerNativePushNotification(title, bodyText) {
      if ('Notification' in window && Notification.permission === 'granted') {
        try {
          new Notification(title, {
            body: bodyText,
            icon: 'favicon.png'
          });
        } catch(e) {}
      }
    }
  </script>
</head>
<body>
  <script src="flutter.js" defer></script>
  <script>
    window.addEventListener('load', function(ev) {
      if (typeof _flutter !== 'undefined' && _flutter.loader) {
        _flutter.loader.loadEntrypoint({
          serviceWorker: { serviceWorkerVersion: null },
          onEntrypointLoaded: function(engineInitializer) {
            engineInitializer.initializeEngine().then(function(appRunner) {
              appRunner.runApp();
            }).catch(function(){});
          }
        }).catch(function(){});
      }
    });
  </script>
  <script src="main.dart.js" type="application/javascript" defer></script>
</body>
