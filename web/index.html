<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G Wash NG</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- ✅ Browser key (auto created by Firebase) -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCSBBZZdb5oP_dXrMy56_W5LpKciS-ieQ4&libraries=places,geometry&loading=async">
  </script>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
  
  <style>
    /* Suppress Google Maps API key / quota warning modal overlay */
    .gm-err-container, 
    .gm-err-content, 
    div[style*="z-index: 1000001"],
    div[style*="z-index: 1000002"] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
  </style>

  <script>
    window.flutterWebRenderer = "canvaskit";
    console.log('🚀 G Wash NG - Web App');

    // Auto dismiss Google Maps billing alert dialogs if injected
    setInterval(function() {
      var errContainers = document.querySelectorAll('.gm-err-container');
      errContainers.forEach(function(el) { el.remove(); });
      var dismissBtns = document.querySelectorAll('.gm-err-clean-btn, button[aria-label="Close"]');
      dismissBtns.forEach(function(btn) { btn.click(); });
    }, 500);

    function requestPushPermission() {
      if ('Notification' in window && Notification.permission !== 'granted') {
        Notification.requestPermission().then(function(perm) {
          console.log('📲 Native Push Notification Permission:', perm);
        });
      }
    }

    function triggerNativePushNotification(title, bodyText) {
      if ('Notification' in window) {
        if (Notification.permission === 'granted') {
          try {
            new Notification(title, {
              body: bodyText,
              icon: 'assets/images/logo_small.png'
            });
          } catch(e) {
            console.log('Push notification notice:', e);
          }
        } else if (Notification.permission !== 'denied') {
          Notification.requestPermission().then(function(perm) {
            if (perm === 'granted') {
              new Notification(title, { body: bodyText });
            }
          });
        }
      }
    }
  </script>
</head>
<body>
  <script src="main.dart.js" type="application/javascript"></script>
</body>
</html>
