<!DOCTYPE html>
<html>
<head>
  <script>
    // 🔇 Silence all browser console output and catch uncaught exceptions for production security
    (function() {
      var noop = function() {};
      window.console.log = noop;
      window.console.info = noop;
      window.console.warn = noop;
      window.console.debug = noop;
      window.console.error = noop;

      window.onerror = function() { return true; };
      window.onunhandledrejection = function() { return true; };

      window.addEventListener('error', function(e) {
        if (e && e.preventDefault) e.preventDefault();
        if (e && e.stopImmediatePropagation) e.stopImmediatePropagation();
        return true;
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.preventDefault) e.preventDefault();
        if (e && e.stopImmediatePropagation) e.stopImmediatePropagation();
        return true;
      }, true);

      // 🎥 Auto-close VideoFrame instances before garbage collection to prevent Chromium stalls
      if (typeof window.VideoFrame !== 'undefined') {
        try {
          var OrigVF = window.VideoFrame;
          var registry = typeof FinalizationRegistry !== 'undefined'
            ? new FinalizationRegistry(function(handle) {
                try { if (handle && typeof handle.close === 'function') handle.close(); } catch(err) {}
              })
            : null;

          function WrappedVideoFrame(init, options) {
            var vf = new OrigVF(init, options);
            if (registry) registry.register(vf, vf);
            return vf;
          }
          WrappedVideoFrame.prototype = OrigVF.prototype;
          window.VideoFrame = WrappedVideoFrame;
        } catch (e) {}
      }
    })();
  </script>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A192F">
  <title>G Wash NG</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png"/>
  
  <!-- Material Icons & Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Round">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Roboto:wght@300;400;500;700&display=swap">

  <style>
    /* 🌟 Instant Brand Splash Screen (Eliminates white screen delay) */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0A192F;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #app-splash-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #112240 0%, #0A192F 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #app-splash-loader.loaded {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-brand-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .splash-logo-container {
      position: relative;
      width: 100px;
      height: 100px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .splash-logo-glow {
      position: absolute;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.35) 0%, rgba(16, 185, 129, 0) 70%);
      border-radius: 50%;
      animation: splashPulse 2.5s infinite ease-in-out;
    }

    .splash-logo-img {
      width: 88px;
      height: 88px;
      object-fit: contain;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      position: relative;
      z-index: 2;
    }

    .splash-title {
      font-size: 26px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: -0.5px;
      margin: 0 0 6px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .splash-title span {
      color: #10B981;
    }

    .splash-subtitle {
      font-size: 14px;
      color: #94A3B8;
      margin: 0 0 32px 0;
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    /* Modern Circular Gradient Spinner */
    .splash-spinner-box {
      width: 44px;
      height: 44px;
      position: relative;
    }

    .splash-spinner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.08);
      border-top-color: #10B981;
      border-right-color: #059669;
      animation: splashSpin 0.9s infinite linear;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
    }

    .splash-status-text {
      margin-top: 18px;
      font-size: 12px;
      color: #64748B;
      letter-spacing: 0.5px;
      font-weight: 600;
      text-transform: uppercase;
      animation: splashFade 1.5s infinite alternate;
    }

    @keyframes splashSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes splashPulse {
      0%, 100% { transform: scale(0.9); opacity: 0.4; }
      50% { transform: scale(1.2); opacity: 0.8; }
    }

    @keyframes splashFade {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }
  </style>

  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCSBBZZdb5oP_dXrMy56_W5LpKciS-ieQ4&libraries=places,geometry&loading=async">
  </script>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
  
  <script>
    function requestPushPermission() {
      if ('Notification' in window && Notification.permission !== 'granted') {
        Notification.requestPermission().catch(function(){});
      }
    }

    function triggerNativePushNotification(title, bodyText) {
      if ('Notification' in window && Notification.permission === 'granted') {
        try {
          new Notification(title, {
            body: bodyText,
            icon: 'favicon.png'
          });
        } catch(e) {}
      }
    }
  </script>
</head>
<body>
  <!-- 🚀 Instant Brand Splash Overlay -->
  <div id="app-splash-loader">
    <div class="splash-brand-wrap">
      <div class="splash-logo-container">
        <div class="splash-logo-glow"></div>
        <img src="logo_small.png" alt="G-Wash Logo" class="splash-logo-img" onerror="this.src='favicon.png'">
      </div>
      <h1 class="splash-title">G-WASH <span>NG</span></h1>
      <p class="splash-subtitle">Nigeria's #1 On-Demand Doorstep Cleaning</p>
      
      <div class="splash-spinner-box">
        <div class="splash-spinner"></div>
      </div>
      <div class="splash-status-text">Starting App...</div>
    </div>
  </div>

  <script src="flutter.js" defer></script>
  <script>
    function removeSplash() {
      var loader = document.getElementById('app-splash-loader');
      if (loader) {
        loader.classList.add('loaded');
        setTimeout(function() {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 500);
      }
    }

    window.addEventListener('load', function(ev) {
      if (typeof _flutter !== 'undefined' && _flutter.loader) {
        _flutter.loader.load({
          serviceWorkerSettings: {
            serviceWorkerVersion: null
          },
          onEntrypointLoaded: function(engineInitializer) {
            engineInitializer.initializeEngine().then(function(appRunner) {
              return appRunner.runApp();
            }).then(function() {
              // Smoothly fade out the splash screen once Flutter renders
              setTimeout(removeSplash, 100);
            }).catch(function(err) {
              removeSplash();
            });
          }
        }).catch(function(err) {
          removeSplash();
        });
      } else {
        // Fallback safety timeout
        setTimeout(removeSplash, 4000);
      }
    });
  </script>
  <script src="main.dart.js" type="application/javascript" defer></script>
</body>
</html>
