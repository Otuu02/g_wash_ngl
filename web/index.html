  <script>
    // 🔇 Silence all browser console output and catch uncaught exceptions for production security
    (function() {
      var noop = function() {};
      window.console.log = noop;
      window.console.info = noop;
      window.console.warn = noop;
      window.console.debug = noop;
      window.console.error = noop;

      window.onerror = function() { return true; };
      window.onunhandledrejection = function() { return true; };

      window.addEventListener('error', function(e) {
        if (e && e.preventDefault) e.preventDefault();
        if (e && e.stopImmediatePropagation) e.stopImmediatePropagation();
        return true;
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.preventDefault) e.preventDefault();
        if (e && e.stopImmediatePropagation) e.stopImmediatePropagation();
        return true;
      }, true);

      // 🎥 Auto-close VideoFrame instances before garbage collection to prevent Chromium stalls
      if (typeof window.VideoFrame !== 'undefined') {
        try {
          var OrigVF = window.VideoFrame;
          var registry = typeof FinalizationRegistry !== 'undefined'
            ? new FinalizationRegistry(function(handle) {
                try { if (handle && typeof handle.close === 'function') handle.close(); } catch(err) {}
              })
            : null;

          function WrappedVideoFrame(init, options) {
            var vf = new OrigVF(init, options);
            if (registry) registry.register(vf, vf);
            return vf;
          }
          WrappedVideoFrame.prototype = OrigVF.prototype;
          window.VideoFrame = WrappedVideoFrame;
        } catch (e) {}
      }
    })();
  </script>

    function requestPushPermission() {
      if ('Notification' in window && Notification.permission !== 'granted') {
        Notification.requestPermission().catch(function(){});
      }
    }

    function triggerNativePushNotification(title, bodyText) {
      if ('Notification' in window && Notification.permission === 'granted') {

          new Notification(title, {
