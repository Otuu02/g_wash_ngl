  <script>
    console.log('🚀 G Wash NG - Web App');


    function requestPushPermission() {
      if ('Notification' in window && Notification.permission !== 'granted') {
        Notification.requestPermission().then(function(perm) {
          console.log('📲 Native Push Notification Permission:', perm);
        });
      }
    }

    function triggerNativePushNotification(title, bodyText) {
      if ('Notification' in window) {
        if (Notification.permission === 'granted') {
          try {
            new Notification(title, {
              body: bodyText,
              icon: 'assets/images/logo_small.png'
            });
          } catch(e) {
            console.log('Push notification notice:', e);
          }
        } else if (Notification.permission !== 'denied') {
          Notification.requestPermission().then(function(perm) {
            if (perm === 'granted') {
              new Notification(title, { body: bodyText });
            }
          });
        }
      }
    }
  </script>
</head>
  <script src="flutter.js" defer></script>
  <script>
    window.addEventListener('load', function(ev) {
      if (typeof _flutter !== 'undefined' && _flutter.loader) {
        _flutter.loader.loadEntrypoint({
          serviceWorker: { serviceWorkerVersion: null },
          onEntrypointLoaded: function(engineInitializer) {
            engineInitializer.initializeEngine().then(function(appRunner) {
              appRunner.runApp();
            });
          }
        });
      }
    });
  </script>
